<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brands | DREAMZ DC</title>
  <link rel="icon" href="/images/logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<main>
  <section class="page-hero">
    <div class="page-container">
      <h1>Featured brands</h1>
      <p>House product plus the labels people actually ask for in DC.</p>
    </div>
  </section>
  <section class="section" style="padding-top:8px">
    <div class="page-container brand-grid" id="brandGrid"></div>
  </section>
</main>
<script src="/components/age-gate.js"></script>
<script src="/js/products.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/site.js"></script>
<script>
  const brands = [
    { slug: 'dreamz-compound', name: 'DREAMZ DC COMPOUND', blurb: 'Our signature line — flower, vapes, edibles, topicals.', img: '/images/logo.jpg' },
    { slug: 'cookies', name: 'Cookies', blurb: 'Premium genetics, flower, and Fat Boy hardware.', img: '/images/cookies-brand-logo.jpg' },
    { slug: 'ganjavores', name: 'Ganjavores', blurb: 'DC-rooted flower and vapes.', img: '/images/ganjavores-dispensary-brand-logo.jpg' },
    { slug: 'jeeter-juice', name: 'Jeeter Juice', blurb: 'Live resin straw disposables.', img: '/images/jeeter-juice-brand-logo.jpg' },
    { slug: 'jungle-boys', name: 'Jungle Boys', blurb: 'Flower bud cultivated in Los Angeles, California.', img: '/images/jungleboys_logo.jpg' },
    { slug: 'muha-meds', name: 'Muha Meds', blurb: 'Cartridges and high-dose edibles.', img: '/images/muhameds-crest-brand-logo.jpg' },
    { slug: 'trulieve', name: 'Trulieve', blurb: 'Locally-Sourced!', img: '/images/trulieve-brand-logo.jpg' },
    { slug: 'khalifa-kush', name: 'Khalifa Kush', blurb: 'Exclusive bud strains by Wiz Khalifa.', img: '/images/khalifa-kush-brand-logo.jpg' },
    { slug: 'grow-west', name: 'Grow West', blurb: 'Premium flower and vapes.', img: '/images/grow-west-brand-logo.jpg' },
    { slug: 'district-cannabis', name: 'District Cannabis', blurb: 'Premium & Top-Shelf flower and concentrates.', img: '/images/district-cannabis-logo-new.jpg' },
    { slug: 'friendly-farms', name: 'Friendly Farms', blurb: 'East Coast grown flower, concentrates & vapes.', img: '/images/friendly-farms-brand-logo.jpg' },
    { slug: 'district-cannabis', name: 'District Cannabis', blurb: 'Exclusive edible gummies, the #1 Edible Brand.', img: '/images/DeVour-Edibles-brand-logo.jpg' },
    { slug: 'cultivation-labs', name: 'Cultivation Labs', blurb: 'Local grown, Maryland-based - Flower, Vapes & Edibles.', img: '/images/cultivation-labs-brand-logo.jpg' },
    { slug: 'bargain-budd', name: 'Bargain Budd', blurb: 'Local-grown flower and concentrates.', img: '/images/bargainbudd-logo.jpg' }
  ];
  document.getElementById('brandGrid').innerHTML = brands.map(b => `
    <a class="brand-card" href="/shop.html?brand=${encodeURIComponent(b.slug)}">
      <img src="${b.img}" alt="${b.name}">
      <h3>${b.name}</h3>
      <p style="color:#888">${b.blurb}</p>
    </a>`).join('');
</script>
</body>
</html>
