<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | DREAMZ DC</title>
  <meta name="description" content="Shop the full DREAMZ DC menu — flower, vapes, edibles, pre-rolls, and more.">
  <link rel="icon" href="/images/logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<main>
  <section class="page-hero">
    <div class="page-container">
      <h1>Shop</h1>
      <p>Full menu. Add to cart, then checkout for delivery or curbside pickup.</p>
    </div>
  </section>
  <section class="section" style="padding-top:8px">
    <div class="page-container">
      <div class="search-row">
        <input id="shopSearch" type="search" placeholder="Search strains, brands, products">
        <select id="brandFilter"></select>
        <span id="resultCount" style="color:#888;align-self:center"></span>
      </div>
      <div class="filter-bar" id="filterBar"></div>
      <div class="products-grid" id="productsGrid"></div>
    </div>
  </section>
</main>
<script src="/js/products.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/site.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
